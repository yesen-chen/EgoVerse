[project]
name = "egoverse-pi05-jax"
version = "0.1.0"
description = "Isolated Pi0.5 JAX training and serving; setup is user-managed"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openpi", "openpi-client", "lerobot",
    "jax[cuda12]==0.6.2", "jaxlib==0.6.2",
    "jax-cuda12-plugin==0.6.2", "jax-cuda12-pjrt==0.6.2",
    "flax==0.10.2", "orbax-checkpoint==0.11.13", "optax==0.2.4",
    "equinox==0.12.2", "chex==0.1.90", "numpy==1.26.4",
    "ml-dtypes==0.5.4", "tensorstore==0.1.74", "etils[epath,epy]==1.12.2",
    "torch==2.7.1", "torchvision==0.22.1", "torchcodec==0.4.0",
    "transformers==4.53.2", "datasets==3.6.0", "huggingface-hub==0.32.3",
    "zarr==3.1.5", "scipy>=1.13,<2", "opencv-python==4.11.0.86",
    "nvidia-cublas-cu12==12.9.2.10", "nvidia-cuda-cupti-cu12==12.9.79",
    "nvidia-cuda-nvcc-cu12==12.9.86", "nvidia-cuda-nvrtc-cu12==12.9.86",
    "nvidia-cuda-runtime-cu12==12.9.79", "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.4.1.4", "nvidia-cusolver-cu12==11.7.5.82",
    "nvidia-cusparse-cu12==12.5.10.65", "nvidia-nccl-cu12==2.30.4",
    "nvidia-nvjitlink-cu12==12.9.86", "nvidia-nvshmem-cu12==3.6.5",
    "pyarrow==25.0.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = ["jax[cuda12]==0.6.2", "ml-dtypes==0.5.4", "tensorstore==0.1.74"]

[tool.uv.sources]
openpi = { path = "openpi", editable = true }
openpi-client = { path = "openpi/packages/openpi-client", editable = true }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
